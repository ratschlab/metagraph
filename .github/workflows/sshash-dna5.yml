name: SSHash DNA5

on:
  pull_request:
    branches: [master, 'codex/**']
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: sshash-dna5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dna5:
    name: DNA5 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make g++ autoconf automake libtool ccache libbz2-dev libjemalloc-dev libboost-all-dev libdeflate-dev liblzma-dev libzstd-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install bzip2 libomp boost jemalloc autoconf automake libtool libdeflate icu4c openssl@3 zstd cmake pkg-config ccache
          printf 'OPENSSL_ROOT_DIR=%s\n' "$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S metagraph -B build-dna5 -DCMAKE_BUILD_TYPE=Debug -DCMAKE_DBG_ALPHABET=DNA5 -DBUILD_KMC=OFF
      - name: Build SSHash regression tests
        run: cmake --build build-dna5 --target unit_tests_sshash --parallel 3
      - name: Run SSHash regression tests
        run: ./build-dna5/unit_tests_sshash
