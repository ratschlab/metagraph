name: Linux

on:
  workflow_call:
    inputs:
      build_type:
        required: true
        type: string
      alphabet:
        required: true
        type: string
      compiler:
        required: true
        type: string
      cc:
        required: true
        type: string
      cxx:
        required: true
        type: string
      build_static:
        required: true
        type: string
      with_avx:
        required: true
        type: string
      # What the jobs after the build run: main.yml's matrix leaves these at their defaults,
      # dev-branch.yml narrows them to the development branch's checks
      unit_test_filter:
        description: gtest filter of the unit tests (empty runs every test)
        required: false
        type: string
        default: ''
      integration_test_filters:
        description: main.py --test_filter patterns, separated by spaces, one run each ('*' runs every test)
        required: false
        type: string
        default: '*'
      examples:
        description: build and run the examples
        required: false
        type: boolean
        default: true
      mini_refseq:
        description: >-
          how mini-index-tests gets the mini index: build (build_mini_refseq.sh, from NCBI's
          records) or fetch (fetch_mini_refseq.sh, the published copy the fixtures were
          answered on)
        required: false
        type: string
        default: build

jobs:
  build:
    runs-on: &platform ubuntu-24.04

    env: &linux-build-env
      CCACHE_DEFAULT_DIR: ~/.cache/ccache
      LD_LIBRARY_PATH: /usr/local/lib/:$LD_LIBRARY_PATH
      DESCRIPTOR: >-
        ${{ inputs.build_type }}-${{ inputs.alphabet }}-${{ inputs.compiler }}-${{ inputs.build_static == 'ON' && 'static' || 'dynamic' }}-${{ inputs.with_avx == 'ON' && 'AVX' || 'noAVX' }}
      CMAKE_ARGS: >-
        -DCMAKE_BUILD_TYPE=${{ inputs.build_type }}
        -DBUILD_STATIC=${{ inputs.build_static }}
        -DWITH_AVX=${{ inputs.with_avx }}
        -DWITH_MSSE42=${{ inputs.with_avx }}
        -DCMAKE_DBG_ALPHABET=${{ inputs.alphabet }}

    name: Build
    defaults: &linux-shell-defaults
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - &checkout-submodules-cache
        name: Checkout submodules cache
        uses: actions/cache@v4
        with:
          path: |
            .git/modules
            metagraph/external-libraries
          key: submodules-${{ hashFiles('.gitmodules') }}

      - &checkout-submodules-update
        name: Checkout submodules
        run: git submodule update --init --recursive --depth 1

      - &install-linux-deps
        name: Install build dependencies
        run: |
          sudo apt-get update
          if [[ "${{ inputs.compiler }}" != "clang" ]]; then
              sudo apt-get install -y ${{ inputs.compiler }}
          fi
          sudo apt-get install -y cmake make libbz2-dev libjemalloc-dev libboost-all-dev libdeflate-dev liblzma-dev libzstd-dev
          if [ "${{ inputs.build_static }}" = "ON" ]; then
            sudo apt-get install -y libcurl4-openssl-dev
          fi
          echo "CC=$(which ${{ inputs.cc }})" >> $GITHUB_ENV
          echo "CXX=$(which ${{ inputs.cxx }})" >> $GITHUB_ENV

      - &install-ccache-linux
        name: Install ccache (Linux)
        run: sudo apt-get install -y ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DEFAULT_DIR }}
          key: ccache-build-${{ env.DESCRIPTOR }}
          restore-keys: |
            ccache-build-

      - &setup-ccache-config
        name: Setup ccache config
        run: |
          ccache --set-config=max_size=1G
          ccache --set-config=compression=true
          ccache --zero-stats

      - &configure-metagraph
        name: Configure
        run: |
          mkdir -p metagraph/build
          cd metagraph/build
          cmake ${CMAKE_ARGS} ..

      - &build-metagraph
        name: Build metagraph
        run: cd metagraph/build && make -j"$(getconf _NPROCESSORS_ONLN)" metagraph

      - &build-unit-tests
        name: Build unit tests
        run: cd metagraph/build && make -j"$(getconf _NPROCESSORS_ONLN)" unit_tests

      - &build-other
        name: Build other
        run: cd metagraph/build && make -j"$(getconf _NPROCESSORS_ONLN)"

      - &show-ccache-stats
        name: Show ccache statistics
        run: ccache --show-stats

      - &upload-build-artifacts
        name: upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: &artifact artifact-${{ env.DESCRIPTOR }}
          path: |
            metagraph/build/metagraph_${{ inputs.alphabet }}
            metagraph/build/unit_tests_parallel
            metagraph/build/unit_tests
          include-hidden-files: true
          retention-days: 1

      # for potential release
      - name: rename binary
        if: inputs.with_avx == 'OFF'
        run: mv metagraph/build/metagraph_${{ inputs.alphabet }} metagraph/build/metagraph_${{ inputs.alphabet }}_noAVX

      - name: upload static binary
        if: ${{ inputs.build_static == 'ON' && inputs.compiler == 'g++-13' }}
        uses: actions/upload-artifact@v4
        with:
          name: metagraph_${{ inputs.alphabet }}${{ inputs.with_avx == 'OFF' && '_noAVX' || '' }}_linux_x86
          path: metagraph/build/metagraph_${{ inputs.alphabet }}${{ inputs.with_avx == 'OFF' && '_noAVX' || '' }}

  unit-tests:
    runs-on: *platform
    needs: [build]

    env: *linux-build-env

    name: Unit Tests

    defaults: *linux-shell-defaults

    steps:
      - uses: actions/checkout@v4

      - *install-linux-deps

      - &download-build-artifacts
        name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: *artifact
          path: metagraph/build

      - &run-unit-tests
        name: run unit tests
        env:
          UNIT_TEST_FILTER: ${{ inputs.unit_test_filter }}
        run: |
          cd metagraph/build && chmod +x unit_tests{,_parallel}
          if [ -n "$UNIT_TEST_FILTER" ]; then
            ./unit_tests_parallel --gtest_filter="$UNIT_TEST_FILTER"
          else
            ./unit_tests_parallel
          fi


  integration-tests:
    runs-on: *platform
    needs: [build]

    env: *linux-build-env

    name: Integration Tests

    defaults: *linux-shell-defaults

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
          cache: pip
          cache-dependency-path: metagraph/workflows/requirements.txt

      - *install-linux-deps

      - name: Install Python packages for tests
        run: |
          pip3 install parameterized
          sudo apt-get install python3-venv

      - *download-build-artifacts

      - &recreate-metagraph-symlink
        name: Recreate metagraph symlink
        run: |
          cd metagraph/build
          binary_name="metagraph_${{ inputs.alphabet }}"
          chmod +x "${binary_name}"
          ln -sf "${binary_name}" metagraph

      - &run-integration-tests
        name: Run integration tests
        env:
          INTEGRATION_TEST_FILTERS: ${{ inputs.integration_test_filters }}
        run: |
          ./metagraph/integration_tests/install_test_environment.sh metagraph/api/python metagraph/build/test_venv
          cd metagraph/build
          # read -a: the patterns are split at spaces and never expanded as file names
          read -r -a filters <<< "$INTEGRATION_TEST_FILTERS"
          [ "${#filters[@]}" -gt 0 ] || { echo "no integration test filter" >&2; exit 1; }
          for filter in "${filters[@]}"; do
            ./test_venv/bin/python ../integration_tests/main.py --test_filter "$filter"
          done

      # with the whole integration suite only, not with a selection of it
      - name: check metagraph workflows
        if: inputs.alphabet == 'DNA' && inputs.integration_test_filters == '*'
        run: |
          export PATH="$(pwd)/metagraph/build/:$PATH"
          metagraph --help
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r metagraph/workflows/requirements.txt
          cd metagraph/workflows
          pytest


  # The Python library's tests (metagraph/api/python/tests: metagraph.traverse and the pattern
  # fixtures' validator), on one configuration of the matrix: they test Python code and read
  # committed fixtures, and the binary only where a test runs the CLI ($METAGRAPH_CLI).
  python-tests:
    if: inputs.alphabet == 'DNA' && inputs.build_type == 'Release' && inputs.compiler == 'g++-13' && inputs.build_static == 'OFF'
    runs-on: *platform
    needs: [build]

    env: *linux-build-env

    name: Python Tests

    defaults: *linux-shell-defaults

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
          cache: pip
          cache-dependency-path: metagraph/api/python/requirements.txt

      - *install-linux-deps

      - *download-build-artifacts

      - *recreate-metagraph-symlink

      - name: Install the Python API
        run: pip install -e metagraph/api/python

      - name: Run the Python tests
        run: |
          export METAGRAPH_CLI="$GITHUB_WORKSPACE/metagraph/build/metagraph"
          cd metagraph/api/python
          python -m unittest discover -s tests -t . -p 'test_traverse_*.py'
          python -m unittest tests.test_pattern_fixtures


  # The tests that need the mini index (scripts/traversal/build_mini_refseq.sh: 42 RefSeq
  # records in the format of the public refseq33m index): the MiniRefSeq unit tests, the
  # contract of the stored fixtures (the pattern bodies against what this binary answers on
  # the mini, the graphlet documents against its CLI), and the integration classes that run on
  # it. The index comes one of two ways (input mini_refseq):
  # - build: built with this binary from the records; only the NCBI downloads are cached
  #   (keyed on the accession table), and the build still asks NCBI's esummary once to check
  #   the table. The build picks its row-diff anchors anew each time, so this index is not the
  #   one the pattern fixtures were answered on: TestPatternFixtures compares every body but
  #   the decode work those anchors make. The build needs NCBI's E-utilities to be reachable,
  #   so a failure of this job does not fail the workflow.
  # - fetch: the published copy the fixtures were answered on (fetch_mini_refseq.sh, from a
  #   pre-release of this repository; the archive cached under its name): TestPatternFixtures
  #   compares every byte, and a failure fails the workflow.
  mini-index-tests:
    if: inputs.alphabet == 'DNA' && inputs.build_type == 'Release' && inputs.compiler == 'g++-13' && inputs.build_static == 'OFF'
    runs-on: *platform
    needs: [build]
    continue-on-error: ${{ inputs.mini_refseq == 'build' }}

    env: *linux-build-env

    name: Mini-index Tests

    defaults: *linux-shell-defaults

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - *install-linux-deps

      - name: Install Python packages for tests
        run: sudo apt-get install -y python3-venv

      - *download-build-artifacts

      - *recreate-metagraph-symlink

      - name: Cache the mini index's downloads
        if: inputs.mini_refseq == 'build'
        uses: actions/cache@v4
        with:
          path: metagraph/build/mini_refseq/raw
          key: mini-refseq-raw-${{ hashFiles('metagraph/scripts/traversal/mini_refseq_accessions.tsv') }}

      - name: Build the mini index
        if: inputs.mini_refseq == 'build'
        run: |
          cd metagraph/build
          REUSE_RAW=1 THREADS="$(getconf _NPROCESSORS_ONLN)" \
            ../scripts/traversal/build_mini_refseq.sh ./mini_refseq ./metagraph \
            ../scripts/traversal/mini_refseq_accessions.tsv

      # the archive's name is the cache key: a new published copy is a new name
      - name: Name the published mini index
        if: inputs.mini_refseq == 'fetch'
        id: mini-asset
        run: |
          name="$(metagraph/scripts/traversal/fetch_mini_refseq.sh --asset)"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # restored and saved in separate steps, so that a run whose tests fail keeps it too
      - name: Restore the published mini index
        if: inputs.mini_refseq == 'fetch'
        id: mini-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/metagraph-test-data
          key: test-data-${{ steps.mini-asset.outputs.name }}

      - name: Fetch the published mini index
        if: inputs.mini_refseq == 'fetch'
        run: |
          export METAGRAPH_TEST_DATA="$HOME/.cache/metagraph-test-data"
          metagraph/scripts/traversal/fetch_mini_refseq.sh metagraph/build/mini_refseq

      - name: Save the published mini index
        if: inputs.mini_refseq == 'fetch' && steps.mini-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/metagraph-test-data
          key: test-data-${{ steps.mini-asset.outputs.name }}

      - name: Unit tests on the mini index
        run: |
          cd metagraph/build
          chmod +x unit_tests
          ./unit_tests --gtest_filter='*MiniRefSeq*'

      - name: The graphlet documents are what this CLI writes
        run: |
          cd metagraph
          python scripts/traversal/graphlet_fixtures.py --from-cli build/metagraph --check

      - name: Integration tests on the mini index
        run: |
          ./metagraph/integration_tests/install_test_environment.sh metagraph/api/python metagraph/build/test_venv
          cd metagraph/build
          # a missing input fails the guarded classes instead of skipping them
          export METAGRAPH_REQUIRE_GUARDS=1
          ./test_venv/bin/python ../integration_tests/main.py --test_filter '*Mini*' < /dev/null
          # the pattern bodies are what this binary answers on the mini (pattern_fixtures.py;
          # on the published copy every byte, on a build of its own every byte but the decode
          # work of its row-diff anchors)
          ./test_venv/bin/python ../integration_tests/main.py --test_filter '*TestPatternFixtures*' < /dev/null


  examples:
    if: inputs.examples
    runs-on: *platform

    env: *linux-build-env
    name: Examples

    defaults: *linux-shell-defaults

    steps:
      - uses: actions/checkout@v4

      - *checkout-submodules-cache

      - *checkout-submodules-update

      - *install-linux-deps

      - *install-ccache-linux

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DEFAULT_DIR }}
          key: ccache-examples-${{ env.DESCRIPTOR }}
          restore-keys: |
            ccache-examples-

      - *setup-ccache-config

      - &build-subdirectory-example
        name: Build and run subdirectory example
        run: |
          cd metagraph/examples/subdirectory
          mkdir -p build && cd build
          cmake ${CMAKE_ARGS} ..
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make run_example

      - &build-externalproject-example
        name: Build and run ExternalProject example
        run: |
          cd metagraph/examples/ExternalProject
          mkdir -p build/metagraph-external-prefix/src
          ln -sf "${GITHUB_WORKSPACE}" build/metagraph-external-prefix/src/metagraph-external
          cd build
          cmake -DMETAGRAPH_GIT_TAG=${{ github.event.pull_request.head.sha || github.sha }} ${CMAKE_ARGS} ..
          # Skip GitHub sync for speed and to bypass github.sha unavailability in PRs from forks
          touch metagraph-external-prefix/src/metagraph-external-stamp/metagraph-external-mkdir
          touch metagraph-external-prefix/src/metagraph-external-stamp/metagraph-external-download
          touch metagraph-external-prefix/src/metagraph-external-stamp/metagraph-external-update
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make run_example

      - *show-ccache-stats
