name: Development branch

# The checks of the development branch gr/labeled-traversal (labeled traversal, graphlets,
# pattern search) on one Linux configuration, and its suites on a Protein build of it. A push
# runs them only when its head commit's message contains "[ci]" (a plain push starts the
# workflow, and its jobs are skipped); workflow_dispatch runs them on demand. master, tags and
# pull requests run main.yml.
on:
  push:
    branches:
      - gr/labeled-traversal
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # linux.yml on the configuration its Python and mini-index jobs run on: the build, the
  # branch's unit tests, its integration test modules, the Python library's tests and the
  # tests on the mini index -- fetched, the copy the pattern fixtures were answered on, so
  # that TestPatternFixtures compares every byte. No examples, no other integration modules.
  Linux:
    if: &requested "github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ci]')"
    name: Linux (DNA, Release, g++-13)
    uses: ./.github/workflows/linux.yml
    with:
      build_type: Release
      alphabet: DNA
      compiler: g++-13
      cc: gcc-13
      cxx: g++-13
      build_static: 'OFF'
      with_avx: 'ON'
      # the branch's suites (traversal, graphlets and their attempts, pattern search) and the
      # annotation code they read through. The tests on the mini index skip here
      # (unit_tests_parallel runs each shard in a directory of its own, without mini_refseq/)
      # and run in mini-index-tests. The multi-graph fan-out and its request registry
      # (ServerFanout, IdNamespace) are whole suites: *Attempt* alone matched a few of their tests.
      # The server's other suites (the header certificates, the envelope, the selection, the
      # cache, labels not in a graph, index names, task resources, the query's helpers) and
      # inner_prod's (GPT review 5, finding 10) are named one by one: none matched before
      unit_test_filter: '*Walker*:*LabelOracle*:*Resolve*:*Trie*:*SupportStep*:*Graphlet*:*Stage2Review*:*Attempt*:*ServerRequest*:*PathCache*:*Pattern*:*CoordToHeader*:*AlignmentFormatCoords*:*HeaderIndex*:*RowDiff*:*BRWT*:*Annotat*:*MultiGraph*:*MaskCheck*:*TraverseNotInGraph*:ServerFanout.*:IdNamespace.*:*ServerCapacity*:HeadersUnique.*:ServerEnvelope.*:ServerSelection.*:ServerCacheConfig.*:ServerQueryCache.*:ServerSearchRequest.*:LabelsNotInGraph.*:IndexNames.*:TaskResources.*:ThreadUsage.*:SeqSearchResult.*:collapse_coord_ranges.*:construct_query_graph.*:encode_presence_mask.*:split_contigs_for_rebalancing.*:bit_vector.inner_prod*'
      # the branch's integration modules, whole; their classes on the mini index skip here and
      # run in mini-index-tests. Since GPT review 5 (finding 17) also E14's per-form traversal
      # tests (test_traverse_forms: `*(test_traverse.*` does not match them) and the server's
      # upstream modules the branch changed: the /search cache, the shutdown, /align, query
      # and the API. test_query (about 20 minutes here) runs in a second job beside the others
      integration_test_filters: '*(test_traverse.* *(test_traverse_forms.* *(test_pattern.* *(test_multigraph.* *(test_transform_mask.* *(test_server_cache.* *(test_server_shutdown.* *(test_align.* *(test_api.*'
      integration_test_filters_2: '*(test_query.*'
      examples: false
      mini_refseq: fetch

  # The same suites on a Protein build (SPEC-labeled-traversal-core.md §6.12, T66): the unit
  # tests a Protein build compiles (the stranded cases and the DNA pattern suites are left out
  # of it; the protein pattern suites, PatternProtein and PatternProteinRoute, are in),
  # test_traverse's fixtures as protein graphs, test_traverse_protein's protein graph of
  # UniParc's shape and test_pattern_protein's pattern search on protein graphs (E16,
  # SPEC-pattern-search.md §29). linux.yml's Python and mini-index jobs run on the DNA build only.
  Linux-Protein:
    if: *requested
    name: Linux (Protein, Release, g++-13)
    uses: ./.github/workflows/linux.yml
    with:
      build_type: Release
      alphabet: Protein
      compiler: g++-13
      cc: gcc-13
      cxx: g++-13
      build_static: 'OFF'
      with_avx: 'ON'
      unit_test_filter: '*Walker*:*LabelOracle*:*Resolve*:*Trie*:*SupportStep*:*Graphlet*:*Stage2Review*:*Attempt*:*ServerRequest*:*PathCache*:*Pattern*:*CoordToHeader*:*AlignmentFormatCoords*:*HeaderIndex*:*RowDiff*:*BRWT*:*Annotat*:*MultiGraph*:*MaskCheck*:*TraverseNotInGraph*:HeadersUnique.*:bit_vector.inner_prod*'
      # and the server's upstream modules on protein graphs (test_traverse_forms is DNA only),
      # test_query in a second job beside the others
      integration_test_filters: '*(test_traverse.* *(test_traverse_protein.* *(test_pattern_protein.* *(test_server_cache.* *(test_server_shutdown.* *(test_align.* *(test_api.*'
      integration_test_filters_2: '*(test_query.*'
      examples: false

  # The generated test data against their generators, without a build: the MGT v1 codec
  # vectors and the hand-made graphlet documents. The CLI graphlet documents and the pattern
  # bodies are checked against the build, in mini-index-tests; the pattern bodies against the
  # SPEC in python-tests. And the examples of the graphlets page (graphlets.rst) against the
  # library, which needs no build either.
  fixture-checks:
    if: *requested
    name: Fixture checks
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: The codec vectors are what make_codec_vectors.py writes
        run: python metagraph/scripts/traversal/make_codec_vectors.py --check

      - name: The hand-made graphlet documents are what graphlet_fixtures.py derives
        run: python metagraph/scripts/traversal/graphlet_fixtures.py --check

      # run_examples.py runs every example of the page in order in one session, from the
      # committed fixtures (the client example against a stand-in server on 127.0.0.1 that
      # replays a committed response), and fails when one prints other than the page shows
      - name: The examples of graphlets.rst print what the page shows
        run: python metagraph/docs/source/_graphlet_examples/run_examples.py
