name: Text rules

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Read shared revision
        id: rules
        shell: bash
        run: |
          revision=$(cat .writing-rules-revision)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ratschlab/writing-rules
          ref: ${{ steps.rules.outputs.revision }}
          path: .writing/shared
          persist-credentials: false
      - name: Verify guidance snapshot
        run: |
          for file in PRINCIPLES.md SOURCES.md ENGINEERING.md LICENSE AUTHORS; do
            cmp "docs/writing/$file" ".writing/shared/$file"
          done
      - name: Install pinned Vale and shared runner
        shell: bash
        run: |
          curl --fail --location --retry 2 \
            https://github.com/vale-cli/vale/releases/download/v3.26.0/vale_3.26.0_Linux_64-bit.tar.gz \
            --output "$RUNNER_TEMP/vale.tar.gz"
          printf '22aa69a556558e4a9dfc63c17030777383d8d3c48dcdfad655fa98e839d666ed  %s\n' "$RUNNER_TEMP/vale.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/vale-bin"
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP/vale-bin" vale
          printf '%s\n' "$RUNNER_TEMP/vale-bin" >> "$GITHUB_PATH"
          python -m pip install .writing/shared
      - name: Install shared style package
        run: |
          writing-rules export-package .writing/WritingRules.zip
          vale sync --no-global
      - name: Check selected prose and diagnostics
        run: writing-rules check
