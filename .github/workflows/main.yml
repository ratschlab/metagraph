name: MetaGraph CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - 'codex/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ========================================================================
  # Linux builds (all valid combinations)
  # ========================================================================

  Linux:
    strategy:
      fail-fast: false
      matrix:
        alphabet: [DNA, Protein]
        build_type: [Debug, Release]
        compiler: [g++-13]
        build_static: [OFF, ON]
        with_avx: [OFF, ON]
        include:
          - compiler: g++-13
            cxx: g++-13
            cc: gcc-13
          # newer compilers: one build each
          - { compiler: g++-14, cxx: g++-14, cc: gcc-14, alphabet: DNA, build_type: Release, build_static: OFF, with_avx: ON }
          - { compiler: g++-15, cxx: g++-15, cc: gcc-15, alphabet: DNA, build_type: Release, build_static: OFF, with_avx: ON }
          - { compiler: g++-16, cxx: g++-16, cc: gcc-16, alphabet: DNA, build_type: Release, build_static: OFF, with_avx: ON }

        exclude:
          - build_type: Debug
            build_static: ON
          - with_avx: OFF
            build_static: OFF

    name: Linux (${{ matrix.alphabet }}, ${{ matrix.build_type }}, ${{ matrix.compiler }}${{ matrix.build_static == 'ON' && ', static' || '' }}${{ matrix.with_avx == 'OFF' && ', noAVX' || '' }})
    uses: ./.github/workflows/linux.yml
    with:
      build_type: ${{ matrix.build_type }}
      alphabet: ${{ matrix.alphabet }}
      compiler: ${{ matrix.compiler }}
      cc: ${{ matrix.cc }}
      cxx: ${{ matrix.cxx }}
      build_static: ${{ matrix.build_static }}
      with_avx: ${{ matrix.with_avx }}

  # ========================================================================
  # Native Apple Silicon builds
  # ========================================================================


  MacOS:
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    name: MacOS (DNA, ${{ matrix.build_type }}, arm64)
    uses: ./.github/workflows/macos.yml
    with:
      build_type: ${{ matrix.build_type }}
      alphabet: DNA
  # ========================================================================
  # Workflow tests
  # ========================================================================

  test-workflows:
    name: Test workflows (with static binary)
    runs-on: ubuntu-24.04
    needs:
      - Linux

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
          cache: pip
          cache-dependency-path: metagraph/workflows/requirements.txt

      - &download-static-artifacts
        name: Download static binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: metagraph_*
          path: artifacts

      - name: setup metagraph binary
        run: |
          sudo ln -s $(pwd)/artifacts/metagraph_DNA_linux_x86/metagraph_DNA /usr/local/bin/metagraph
          sudo chmod +rx /usr/local/bin/metagraph
          /usr/local/bin/metagraph --help
          metagraph --help

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r metagraph/workflows/requirements.txt

      - name: Test metagraph-workflows pytest
        run: |
          cd metagraph/workflows
          pytest

  # ========================================================================
  # Docker build
  # ========================================================================

  docker-build-and-push:
    runs-on: ubuntu-24.04
    needs: [test-workflows]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - &submodule-revision
        name: Get dependency revision
        id: submodules
        run: echo "revision=$(git rev-parse HEAD:metagraph/external-libraries)" >> "$GITHUB_OUTPUT"

      - &checkout-submodules-cache
        name: Checkout submodules cache
        uses: actions/cache@v4
        with:
          path: |
            .git/modules
            metagraph/external-libraries
          key: submodules-${{ hashFiles('.gitmodules') }}-${{ steps.submodules.outputs.revision }}

      - &checkout-submodules-update
        name: Checkout submodules
        run: git submodule update --init --recursive --depth 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Every pushed image gets its commit's tag. A run that finishes after a newer commit's
      # run must not move `master` back to its older image, so `master` moves only after the
      # push, and only while the commit is still the head of the branch.
      - name: Tags to push
        id: meta_push
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,format=long

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta_push.outputs.tags }}
          labels: ${{ steps.meta_push.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Move the branch tag to this image if the commit is still the branch head
        if: github.event_name != 'pull_request' && github.ref_type == 'branch'
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin "$GITHUB_REF")
          head=${remote%%[[:space:]]*}
          image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          if [ "$head" = "$GITHUB_SHA" ]; then
            docker buildx imagetools create -t "$image:$GITHUB_REF_NAME" "$image:sha-$GITHUB_SHA"
          else
            echo "Branch head is $head, not $GITHUB_SHA: $image:$GITHUB_REF_NAME stays"
          fi

  # ========================================================================
  # Release
  # ========================================================================

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Create Release
    runs-on: ubuntu-24.04
    needs: [test-workflows]

    steps:
      - uses: actions/checkout@v4

      - *submodule-revision

      - *checkout-submodules-cache

      - *checkout-submodules-update

      - *download-static-artifacts

      - name: Tag name
        id: tag_name
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "VER=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: build source archive including submodules
        run: |
          version="v$(jq -r .version package.json)"
          [[ "$version" == "${{ steps.tag_name.outputs.TAG }}" ]] \
            || (echo "::error file=package.json::Version in package.json ($version) does not match tag ${{ steps.tag_name.outputs.TAG }}. Update package.json and set the tag again."; \
                exit 1)
          mkdir -p artifacts/sources
          tag=${{ steps.tag_name.outputs.TAG }}
          bash .github/workflows/git-archive-all.sh --format tar.gz artifacts/sources/${tag}-sources-with-submodules.tar.gz
          bash .github/workflows/git-archive-all.sh --format zip artifacts/sources/${tag}-sources-with-submodules.zip

      - name: create release with static binaries
        uses: svenstaro/upload-release-action@v2
        with:
          release_name: Version ${{ steps.tag_name.outputs.VER }}
          body: |
            The pre-compiled binaries (only for Linux) are statically linked and hence don't require additional libraries to be installed.
            The *_noAVX binaries are compiled without the modern AVX2 and MSSE4.2 instructions and should be used when the processor does not support these instructions.
          file: 'artifacts/*/*'
          file_glob: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          prerelease: true
