name: MacOS

on:
  workflow_call:
    inputs:
      build_type:
        required: true
        type: string
      platform:
        required: true
        type: string
      alphabet:
        required: true
        type: string
      target_arch:
        required: true
        type: string

jobs:
    
  build:
    runs-on: &platform ${{ inputs.platform }}

    env: &macos-build-env
      CCACHE_DEFAULT_DIR: ~/Library/Caches/ccache
      DESCRIPTOR: >-
        ${{ inputs.build_type }}-${{ inputs.platform }}-${{ inputs.alphabet }}-${{ inputs.target_arch }}
      DEPS_PLATFORM: ${{ inputs.target_arch == 'x86_64' && 'osx-64' || 'osx-arm64' }}
      CMAKE_ARGS: >-
        -DCMAKE_BUILD_TYPE=${{ inputs.build_type }}
        -DCMAKE_DBG_ALPHABET=${{ inputs.alphabet }}
        -DBoost_USE_STATIC_LIBS=OFF

    name: Build

    defaults: &macos-shell-defaults
      run:
        shell: arch -${{ inputs.target_arch }} /bin/bash -eo pipefail {0}

    steps:
      - uses: actions/checkout@v4

      - &checkout-submodules-cache
        name: Checkout submodules cache
        uses: actions/cache@v4
        with:
          path: |
            .git/modules
            metagraph/external-libraries
          key: submodules-${{ hashFiles('.gitmodules') }}

      - &checkout-submodules-update
        name: Checkout submodules
        run: git submodule update --init --recursive --depth 1

      - &install-macos-deps
        name: Install dependencies
        id: dependencies
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: 2.9.0-0
          environment-name: ci
          init-shell: none
          generate-run-shell: false
          cache-environment: true
          # Pin direct dependencies; transitive dependencies are resolved by conda-forge.
          create-args: >-
            --platform ${{ env.DEPS_PLATFORM }}
            bzip2=1.0.8 llvm-openmp=23.1.3 libboost-devel=1.92.0 jemalloc=5.4.0
            autoconf=2.72 automake=1.19 libtool=2.5.4 libdeflate=1.26
            icu=78.3 openssl=3.6.5 zstd=1.5.7 cmake=4.4.4
            pkg-config=0.29.2 ccache=4.14.1

      - &use-macos-deps
        name: Prepare dependency environment
        env:
          DEPENDENCY_PREFIX: ${{ steps.dependencies.outputs.environment-path }}
        run: |
          echo "$DEPENDENCY_PREFIX/bin" >> "$GITHUB_PATH"
          for variable in CMAKE_PREFIX_PATH OpenMP_ROOT ICU_ROOT; do
            printf '%s=%s\n' "$variable" "$DEPENDENCY_PREFIX" >> "$GITHUB_ENV"
          done

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DEFAULT_DIR }}
          key: ccache-build-${{ env.DESCRIPTOR }}
          restore-keys: |
            ccache-build-

      - &setup-ccache-config
        name: Setup ccache config
        run: |
          ccache --set-config=max_size=1G
          ccache --set-config=compression=true
          ccache --zero-stats

      - &configure-metagraph
        name: Configure
        run: |
          mkdir -p metagraph/build
          cd metagraph/build
          cmake ${CMAKE_ARGS} ..

      - &build-metagraph
        name: Build metagraph
        run: cd metagraph/build && make -j"$(getconf _NPROCESSORS_ONLN)" metagraph

      - &build-unit-tests
        name: Build unit tests
        run: cd metagraph/build && make -j"$(getconf _NPROCESSORS_ONLN)" unit_tests

      - name: Verify target architecture
        run: |
          lipo "metagraph/build/metagraph_${{ inputs.alphabet }}" -verify_arch "${{ inputs.target_arch }}"
          lipo metagraph/build/unit_tests -verify_arch "${{ inputs.target_arch }}"

      - &build-other
        name: Build other
        run: cd metagraph/build && make -j"$(getconf _NPROCESSORS_ONLN)"

      - &show-ccache-stats
        name: Show ccache statistics
        run: ccache --show-stats

      - &upload-build-artifacts
        name: upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: &artifact artifact-${{ env.DESCRIPTOR }}
          path: |
            metagraph/build/metagraph_${{ inputs.alphabet }}
            metagraph/build/unit_tests_parallel
            metagraph/build/unit_tests
          include-hidden-files: true
          retention-days: 1


  unit-tests:
    needs: [build]

    runs-on: *platform

    name: Unit Tests

    env: *macos-build-env

    defaults: *macos-shell-defaults

    steps:
      - uses: actions/checkout@v4

      - *install-macos-deps

      - *use-macos-deps

      - &download-build-artifacts
        name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: *artifact
          path: metagraph/build

      - &run-unit-tests
        name: run unit tests
        run: cd metagraph/build && chmod +x unit_tests{,_parallel} && ./unit_tests_parallel


  integration-tests:
    needs: [build]

    runs-on: *platform

    env: *macos-build-env

    name: Integration Tests

    defaults: *macos-shell-defaults

    steps:
      - uses: actions/checkout@v4

      - *install-macos-deps

      - *use-macos-deps

      - name: install dependencies for integration tests
        run: pip3 install parameterized --break-system-packages --user

      - *download-build-artifacts

      - &recreate-metagraph-symlink
        name: Recreate metagraph symlink
        run: |
          cd metagraph/build
          binary_name="metagraph_${{ inputs.alphabet }}"
          chmod +x "${binary_name}"
          ln -sf "${binary_name}" metagraph

      - &run-integration-tests
        name: Run integration tests
        run: |
          ./metagraph/integration_tests/install_test_environment.sh metagraph/api/python metagraph/build/test_venv
          cd metagraph/build
          ./test_venv/bin/python ../integration_tests/main.py

      - name: check metagraph workflows
        run: |
          export PATH="$(pwd)/metagraph/build/:$PATH"
          metagraph --help
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r metagraph/workflows/requirements.txt
          cd metagraph/workflows
          pytest


  examples:
    if: ${{ inputs.build_type == 'Debug' || (inputs.platform == 'macos-latest' && inputs.target_arch == 'x86_64') }}

    runs-on: *platform

    env: *macos-build-env

    name: Examples

    defaults: *macos-shell-defaults

    steps:
      - uses: actions/checkout@v4

      - *checkout-submodules-cache

      - *checkout-submodules-update

      - *install-macos-deps

      - *use-macos-deps

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DEFAULT_DIR }}
          key: ccache-examples-${{ env.DESCRIPTOR }}
          restore-keys: |
            ccache-examples-

      - *setup-ccache-config

      - &build-subdirectory-example
        name: Build and run subdirectory example
        run: |
          cd metagraph/examples/subdirectory
          mkdir -p build && cd build
          cmake ${CMAKE_ARGS} ..
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make run_example

      - &build-externalproject-example
        name: Build and run ExternalProject example
        run: |
          cd metagraph/examples/ExternalProject
          mkdir -p build/metagraph-external-prefix/src
          ln -sf "${GITHUB_WORKSPACE}" build/metagraph-external-prefix/src/metagraph-external
          cd build
          cmake -DMETAGRAPH_GIT_TAG=${{ github.event.pull_request.head.sha || github.sha }} ${CMAKE_ARGS} ..
          # Skip GitHub sync for speed and to bypass github.sha unavailability in PRs from forks
          touch metagraph-external-prefix/src/metagraph-external-stamp/metagraph-external-mkdir
          touch metagraph-external-prefix/src/metagraph-external-stamp/metagraph-external-download
          touch metagraph-external-prefix/src/metagraph-external-stamp/metagraph-external-update
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make run_example

      - *show-ccache-stats
