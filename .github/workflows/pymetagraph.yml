name: pymetagraph

on:
  pull_request:
    branches: [master, align_refactor]
    paths:
      - 'metagraph/**'
      - '.gitmodules'
      - '.github/workflows/pymetagraph.yml'
      - '.github/scripts/configure-apt-mirrors.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pymetagraph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13', '3.14']
    env:
      CMAKE_GENERATOR: Unix Makefiles
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        timeout-minutes: 10
        run: |
          ./.github/scripts/configure-apt-mirrors.sh
          sudo apt-get update
          sudo apt-get install -y g++-13 cmake make ccache autoconf automake libtool libbz2-dev libboost-iostreams-dev libdeflate-dev liblzma-dev libzstd-dev libssl-dev
          python -m pip install scikit-build-core pybind11 pytest
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: pymetagraph-gcc13-${{ matrix.python }}-${{ github.sha }}
          restore-keys: |
            pymetagraph-gcc13-${{ matrix.python }}-
            pymetagraph-gcc13-
      - name: Build CLI and extension
        run: |
          cmake -S metagraph -B build-native -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_BINDINGS=ON -DMETAGRAPH_BUILD_EXECUTABLE=ON -DPython_EXECUTABLE="$(command -v python)" -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build-native --target metagraph _pymetagraph_core -j2
      - name: Build and install wheel
        run: |
          python -m pip wheel --no-deps --no-build-isolation metagraph/api/python/pymetagraph -w dist -C build-dir="$PWD/build-native"
          python -m pip install --no-deps dist/pymetagraph-*.whl
      - name: Test installed package against CLI
        env:
          METAGRAPH: ${{ github.workspace }}/build-native/metagraph_DNA
        run: python -m pytest -q metagraph/api/python/pymetagraph/tests
