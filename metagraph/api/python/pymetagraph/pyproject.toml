[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "pymetagraph"
version = "0.2.0"
description = "In-process queries and alignment against a metagraph index"
readme = "README.md"
authors = [
    { name = "ratschlab", email = "grlab@ratschlab.org" },
]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3 :: Only",
]

[tool.scikit-build]
build-dir = "build"
cmake.source-dir = "../../.."
cmake.args = ["-DBUILD_PYTHON_BINDINGS=ON", "-DMETAGRAPH_BUILD_EXECUTABLE=OFF"]
cmake.build-type = "Release"
wheel.packages = ["pymetagraph"]
build.targets = ["_pymetagraph_core"]
install.components = ["_pymetagraph_core"]
