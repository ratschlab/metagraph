$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
required:
  - samples
  - output_directory
  - tmpdir
  - k
  - count_width
  - kmc_max_count
  - assembly
anyOf:
  - required: [comparisons]
    properties:
      comparisons:
        minProperties: 1
  - required: [auto_comparisons]
    properties:
      auto_comparisons:
        required: [enabled]
        properties:
          enabled:
            const: true
properties:
  samples:
    type: string
  output_directory:
    type: string
  tmpdir:
    type: string
  metagraph_cmd:
    type: string
    default: metagraph
  kmc_cmd:
    type: string
    default: kmc
  gnu_time_cmd:
    type: string
    default: ""
  k:
    type: integer
    minimum: 2
  count_width:
    type: integer
    minimum: 1
    maximum: 32
  kmc_max_count:
    type: integer
    minimum: 1
  kmc_max_bins:
    type: integer
    minimum: 1
    default: 2000
  annotation_threads_each:
    type: integer
    minimum: 1
    default: 1
  comparisons:
    type: object
    additionalProperties:
      type: object
      required: [metadata_column, in_values, out_values]
      properties:
        metadata_column:
          type: string
        in_values:
          type: array
          minItems: 1
          items: {}
        out_values:
          type: array
          minItems: 1
          items: {}
        assembly:
          type: object
  auto_comparisons:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
      metadata_columns:
        type: array
        uniqueItems: true
        items:
          type: string
      missing_values:
        type: array
        uniqueItems: true
        items: {}
      minimum_samples_per_group:
        type: integer
        minimum: 1
        default: 1
      assembly:
        type: object
  assembly:
    type: object
    required:
      - count_kmers
      - family_wise_error_rate
      - test_by_unitig
      - test_type
      - min_count
    properties:
      count_kmers:
        const: true
      clean:
        type: boolean
      family_wise_error_rate:
        type: number
        exclusiveMinimum: 0
        maximum: 1
      test_by_unitig:
        type: boolean
      test_type:
        enum:
          - notest
          - poisson_binom
          - poisson_exact
          - nbinom_exact
          - mwu
          - cmh
          - cmh_binary
          - fisher_binary
      assemble_shared:
        type: boolean
      min_count:
        type: integer
        minimum: 0
      min_recurrence:
        type: integer
        minimum: 0
      min_in_recurrence:
        type: integer
        minimum: 0
      min_out_recurrence:
        type: integer
        minimum: 0
      max_in_recurrence:
        type: integer
        minimum: 0
      max_out_recurrence:
        type: integer
        minimum: 0
  assembly_output:
    type: object
    properties:
      enumerate:
        type: boolean
      unitigs:
        type: boolean
      prune_tips:
        type: integer
        minimum: 0
      dump_pvals:
        type: boolean
  resources:
    type: object
additionalProperties: true
